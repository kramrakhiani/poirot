[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poirot"
version = "0.2.0"
description = "Poirot: evidence-first binary investigation tooling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Poirot contributors"}]
keywords = ["binary-analysis", "ios-security", "macho", "elf", "pe", "ipsw", "reverse-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = ["rich>=13"]

[project.optional-dependencies]
analysis = ["lief>=0.14", "lzfse>=0.4.0"]
llm = ["httpx>=0.27", "python-dotenv>=1.0"]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/poirot-tool/poirot"
Issues = "https://github.com/poirot-tool/poirot/issues"

[project.scripts]
poirot = "poirot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
